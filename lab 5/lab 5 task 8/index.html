```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка студента</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #312e81);
            color: white;
        }

        .container {
            width: 430px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #475569;
            border-radius: 12px;
            outline: none;
            background: rgba(15, 23, 42, 0.7);
            color: white;
            font-size: 16px;
        }

        input:focus {
            border-color: #818cf8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #818cf8;
            transform: translateY(-2px);
        }

        #card {
            margin-top: 25px;
        }

        .student-card {
            padding: 22px;
            border-radius: 16px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(129, 140, 248, 0.4);
        }

        .student-card h2 {
            margin-top: 0;
            color: #a5b4fc;
        }

        .error {
            color: #f87171;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Карточка студента</h1>

        <label>Имя</label>
        <input type="text" id="name" placeholder="Введите имя">

        <label>Группа</label>
        <input type="text" id="group" placeholder="Например, ИС 252">

        <label>Курс</label>
        <input type="number" id="course" placeholder="Введите курс">

        <button id="createButton">Создать карточку</button>

        <div id="card"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
```
