```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #172554);
            color: white;
        }

        .container {
            width: 430px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #475569;
            border-radius: 12px;
            outline: none;
            background: rgba(15, 23, 42, 0.75);
            color: white;
            font-size: 16px;
        }

        input:focus {
            border-color: #60a5fa;
        }

        .error {
            display: block;
            margin-top: 6px;
            min-height: 18px;
            color: #f87171;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #60a5fa;
            transform: translateY(-2px);
        }

        #result {
            text-align: center;
            margin-top: 20px;
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Создание аккаунта</h1>

        <form id="registrationForm">

            <div class="field">
                <label>Имя</label>
                <input type="text" id="name" placeholder="Введите имя">
                <span class="error" id="nameError"></span>
            </div>

            <div class="field">
                <label>Email</label>
                <input type="text" id="email" placeholder="example@mail.com">
                <span class="error" id="emailError"></span>
            </div>

            <div class="field">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Минимум 6 символов">
                <span class="error" id="passwordError"></span>
            </div>

            <button type="submit">Зарегистрироваться</button>

        </form>

        <p id="result"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
```
