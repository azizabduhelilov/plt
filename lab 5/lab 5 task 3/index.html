<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: white;
        }

        .container {
            width: 380px;
            padding: 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-bottom: 30px;
            font-size: 30px;
        }

        #counter {
            font-size: 70px;
            margin: 20px 0 30px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: #6366f1;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            background: #818cf8;
        }

        #reset {
            background: #334155;
        }

        #reset:hover {
            background: #475569;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Счётчик</h1>

        <div id="counter">0</div>

        <div class="buttons">
            <button id="minus">−</button>
            <button id="reset">Сброс</button>
            <button id="plus">+</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
