<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Desk</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="muted">CONTROL DESK · SECURITY CONSOLE</p><h1>Управление пользователями</h1></header><section class="card" id="login"><h2>Вход администратора</h2><form id="form"><input name="username" placeholder="Логин" required><input name="password" type="password" placeholder="Пароль" required><button>Войти</button></form><p class="muted">Демо: admin / admin123</p></section><section id="dash" class="hidden"><div class="card"><h2>Панель администратора <span class="badge" id="who"></span></h2><p id="counts"></p><h3>Добавить пользователя</h3><form id="create"><input name="name" placeholder="Имя" required><input name="username" placeholder="Логин" required><input name="password" placeholder="Пароль" required><select name="role"><option>student</option><option>teacher</option><option>admin</option></select><button>Создать</button></form></div><div class="card"><h2>Пользователи</h2><table><thead><tr><th>Имя / логин</th><th>Роль</th><th>Статус</th><th></th></tr></thead><tbody id="users"></tbody></table></div><div class="card"><h2>Журнал событий</h2><div id="audit"></div></div><div class="card"><h2>Защищённый API</h2><button id="resource">Проверить доступ</button><p id="result"></p></div><button id="out">Выйти</button></section><p id="message"></p></main><script src="app.js"></script></body></html>
