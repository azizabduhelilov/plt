<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Панель заказов</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><div class="app"><header><p class="eyebrow">ЛАБОРАТОРНАЯ РАБОТА №7 · ПОВЫШЕННЫЙ УРОВЕНЬ</p><h1>Панель заказов</h1><p>Управление статусами и счетчиками заказов</p></header>
<nav><button class="tab active" data-status="new">Новые <span id="count-new">0</span></button><button class="tab" data-status="work">В работе <span id="count-work">0</span></button><button class="tab" data-status="ready">Готовые <span id="count-ready">0</span></button></nav>
<main><section class="summary"><div><span>Всего заказов</span><strong id="total">0</strong></div><div><span>Выполнено</span><strong id="completion">0%</strong></div></section><section id="orders" aria-live="polite"></section>
<form id="order-form"><h2>Добавить заказ</h2><label for="order-name">Название заказа</label><input id="order-name" maxlength="80" placeholder="Например, Заказ №104" required><label for="order-status">Начальный статус</label><select id="order-status"><option value="new">Новый</option><option value="work">В работе</option><option value="ready">Готовый</option></select><button class="primary" type="submit">Добавить заказ</button><p id="error" role="alert"></p></form></main><footer>Статус каждого заказа можно менять. Счетчики обновляются автоматически.</footer></div></body></html>
